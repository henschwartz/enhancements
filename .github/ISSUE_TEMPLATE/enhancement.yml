name: Enhancement
description: Suggest a new capability or refinement for a Praxis repository
labels: ["triage/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Open an issue describing what you want and why.
        Maintainers will triage it and mark it
        `triage/accepted` or `triage/declined`. If it
        needs a written proposal first, they'll add
        `triage/needs-proposal`.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: High-level summary of the enhancement (what and why)
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: Success Criteria
      description: What must be true for this enhancement to be considered complete?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2

  - type: dropdown
    id: repos
    attributes:
      label: Affected Repositories
      description: Which repositories does this enhancement affect?
      multiple: true
      options:
        - praxis
        - operator
        - extproc
        - conventions
        - experimental
        - grid
        - forge
        - policy
        - demos
        - pingora
        - ai
    validations:
      required: true
